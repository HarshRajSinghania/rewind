name: eas-build

# Native builds on EAS. Runs for version tags (production) or by hand (any profile).
# Needs an EXPO_TOKEN repo secret and a linked EAS project (see CONTRIBUTING.md);
# without the secret the build job is skipped.
#
# Manual: Actions → eas-build → Run workflow → pick a profile and platform.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      platform:
        description: Platform
        required: true
        default: all
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: echo "enabled=$([ -n "$EXPO_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build
        env:
          PROFILE: ${{ inputs.profile || 'production' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
