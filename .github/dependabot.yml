version: 2
updates:
  # Workflow actions. App dependencies are pinned by the Expo SDK: upgrade them with
  # `bunx expo install --fix` (CI's expo-doctor fails when they drift).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # v6 moved setup-gradle's caching into a proprietary component under Gradle's Terms of
      # Use (https://blog.gradle.org/github-actions-for-gradle-v6). Stay on v5 (MIT) unless
      # that's accepted.
      - dependency-name: gradle/actions
        update-types: [version-update:semver-major]
