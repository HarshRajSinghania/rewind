name: Bug report
description: Something in Rewind doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an album
        2. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. 1.0.0, or the commit you built from
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
      description: Leave out anything private (your photos, faces).
