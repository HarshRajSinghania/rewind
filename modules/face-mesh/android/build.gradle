plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rewind.facemesh'
version = '1.0.0'

android {
  namespace "expo.modules.facemesh"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  // MediaPipe reads the model from assets (it ships deflated; a library's noCompress doesn't
  // reach the app's packaging, and loading it compressed works fine).
  sourceSets {
    main.assets.srcDirs += ['../assets']
  }
}

dependencies {
  implementation 'com.google.mediapipe:tasks-vision:1.1.1'
}
